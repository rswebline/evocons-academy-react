server {
    server_name academy.evocons.it;

    root /var/www/academy.evocons.it;
    index index.html;

    # Evocons Academy - API manifestazione d'interesse
    location = /api/academy/enrollment-request {
        limit_except POST {
            deny all;
        }

        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8055/academy/enrollment-request;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

location = /api/academy/courses {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/academy/courses/([a-z0-9-]+)/image$ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses/$1/image;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/academy/courses/([a-z0-9-]+)/modules$ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses/$1/modules;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Evocons Academy - Dettaglio editoriale del corso
location ~ ^/api/academy/courses/([a-z0-9-]+)/details$ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses/$1/details;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/academy/courses/([a-z0-9-]+)/(hero-image|overview-image|outcomes-image)$ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses/$1/$2;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ "^/api/academy/courses/([a-z0-9-]+)/modules/([a-f0-9-]{36})/image$" {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8055/academy-catalog/courses/$1/modules/$2/image;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/academy.evocons.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/academy.evocons.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = academy.evocons.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name academy.evocons.it;
    return 404; # managed by Certbot


}
